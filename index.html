<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Macro Regime Playbook</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <h1>Macro Regime Playbook</h1>
  <p class="small">Cross-asset macro monitoring system</p>
  <p id="timestamp" class="small">Loading...</p>

  <!-- CONTROLS -->
  <div class="controls">
    <div>
      <button onclick="setRange(30)">1M</button>
      <button onclick="setRange(90)">3M</button>
      <button onclick="setRange(180)">6M</button>
      <button onclick="setRange(365)">1Y</button>
      <button onclick="setRange(9999)">ALL</button>
    </div>

    <div>
      <button onclick="setMode('raw')">Raw</button>
      <button onclick="setMode('norm')">Normalized</button>
    </div>
  </div>

  <!-- REGIME -->
  <div class="section">
    <h2>Current Regime</h2>
    <div id="regime" class="regime">-</div>
  </div>

  <div class="section">
    <h2>Key Signals</h2>
    <div id="signals"></div>
  </div>

  <!-- GROUPED CARDS -->
  <div id="cards"></div>

  <!-- CHART -->
  <div class="section">
    <h2>Trend</h2>
    <canvas id="chart"></canvas>
  </div>

  <script src="app.js"></script>

</body>
</html>
