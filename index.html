<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Macro Regime Playbook</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">
  <h1>Macro Regime Playbook</h1>
  <p class="small">Cross-asset macro monitoring system</p>
  <p id="timestamp" class="small">Loading...</p>

  <!-- CONTROLS -->
  <div class="controls">
    <div>
      <button onclick="setRange(30)">1M</button>
      <button onclick="setRange(90)">3M</button>
      <button onclick="setRange(180)">6M</button>
      <button onclick="setRange(365)">1Y</button>
      <button onclick="setRange(9999)">ALL</button>
    </div>

    <div>
      <button onclick="setMode('raw')">Raw</button>
      <button onclick="setMode('norm')">Normalized</button>
    </div>
  </div>

  <!-- 🔥 HEADER SYSTEM -->
  <div class="topbar">
    <div id="regime" class="regime-pill"></div>

    <div class="signals-inline" id="signals"></div>

    <div class="legend-row" id="legend"></div>
  </div>

  <!-- TILES -->
  <div id="cards"></div>

  <!-- CHART -->
  <div class="section chart-container">
    <h2>Trend</h2>
    <canvas id="chart"></canvas>
  </div>
  <script src="app.js"></script>
</div>
</body>
</html>
